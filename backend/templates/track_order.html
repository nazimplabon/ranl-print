<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Order — RANL PRINT</title>
<style>body{font-family:Inter,system-ui,sans-serif;background:#f5f7fb;margin:0;color:#101828}.wrap{max-width:760px;margin:70px auto;padding:24px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:32px;box-shadow:0 18px 50px rgba(16,24,40,.08)}h1{margin:0 0 8px;font-size:32px}.muted{color:#667085}form{display:grid;gap:14px;margin-top:24px}input{padding:14px 16px;border:1px solid #d0d5dd;border-radius:12px;font-size:16px}button{padding:14px 18px;border:0;border-radius:12px;background:#111827;color:#fff;font-weight:700;cursor:pointer}.error{color:#b42318;margin-top:12px}.result{margin-top:24px;padding:20px;border-radius:16px;background:#f8fafc;display:none}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #e5e7eb}.row:last-child{border:0}.back{display:inline-block;margin-top:20px;color:#344054;text-decoration:none}</style></head>
<body><main class="wrap"><div class="card"><div class="muted">RANL PRINT</div><h1>Track your order</h1><p class="muted">Enter your order number and the phone number used for the order.</p><form id="trackForm"><input name="order_number" placeholder="Order number (e.g. RNL-ABC12345)" required><input name="phone" placeholder="Phone number" required><button>Track Order</button></form><div id="error" class="error"></div><div id="result" class="result"></div><a class="back" href="/">← Back to RANL PRINT</a></div></main><script>const form=document.getElementById('trackForm'),error=document.getElementById('error'),result=document.getElementById('result');form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';result.style.display='none';try{const r=await fetch('/api/orders/track/',{method:'POST',headers:{'X-CSRFToken':decodeURIComponent(document.cookie.split('; ').find(x=>x.startsWith('csrftoken='))?.split('=')[1]||'')},body:new FormData(form),credentials:'include'});const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to find order.');const o=d.order;result.innerHTML='<div class="row"><b>Order</b><span>'+o.order_number+'</span></div><div class="row"><b>Status</b><span>'+o.status+'</span></div><div class="row"><b>Payment</b><span>'+o.payment_status+'</span></div><div class="row"><b>Delivery</b><span>'+o.delivery_status+'</span></div><div class="row"><b>Total</b><span>৳ '+Number(o.total).toLocaleString('en-BD',{minimumFractionDigits:2})+'</span></div><div class="row"><b>Due</b><span>৳ '+Number(o.due).toLocaleString('en-BD',{minimumFractionDigits:2})+'</span></div>'+(o.tracking_number?'<div class="row"><b>Tracking</b><span>'+o.tracking_number+'</span></div>':'');result.style.display='block'}catch(err){error.textContent=err.message}});fetch('/api/csrf/',{credentials:'include'});</script></body></html>
